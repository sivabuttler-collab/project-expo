                    <span className="px-2.5 py-1 bg-gray-900 text-saffron-400 font-black rounded-lg text-xs">🔒 CREATOR ADMIN</span>
                    <h3 className="font-extrabold text-sm text-gray-900">Doorstep Experts Creator Management Console</h3>
                  </div>
                  <button onClick={() => setAdminConsoleOpen(false)} className="text-gray-400 font-bold hover:text-gray-600 text-lg">✕</button>
                </div>

                {!adminAuthenticated ? (
                  <div className="flex-1 flex flex-col items-center justify-center space-y-4 max-w-md mx-auto text-center py-6">
                    <div className="w-14 h-14 rounded-2xl bg-purple-100 border border-purple-300 flex items-center justify-center text-2xl">
                      🔑
                    </div>
                    <div>
                      <h4 className="font-extrabold text-gray-900 text-base">Creator Admin Login</h4>
                      <p className="text-gray-500 text-[11px] mt-1">Enter your strong creator username and password.</p>
                    </div>

                    {adminError && (
                      <div className="w-full p-2.5 bg-red-50 text-red-700 border border-red-200 rounded-xl font-bold text-[11px]">
                        {adminError}
                      </div>
                    )}

                    <form onSubmit={handleAdminPasswordUnlock} className="w-full space-y-3">
                      <div>
                        <label className="font-bold text-gray-700 block mb-1 text-left">Admin Username</label>
                        <input 
                          type="text"
                          value={adminUsernameInput}
                          onChange={e => setAdminUsernameInput(e.target.value)}
                          placeholder="Enter username (e.g. ADMIN_PRO)"
                          className="w-full p-2.5 border rounded-xl font-mono text-sm font-bold focus:ring-2 focus:ring-purple-500"
                          required
                          autoFocus
                        />
                      </div>

                      <div>
                        <label className="font-bold text-gray-700 block mb-1 text-left">Admin Password</label>
                        <input 
                          type="password"
                          value={adminPasswordInput}
                          onChange={e => setAdminPasswordInput(e.target.value)}
                          placeholder="Enter password (e.g. DE_Master#2026!)"
                          className="w-full p-2.5 border rounded-xl font-mono text-sm font-bold focus:ring-2 focus:ring-purple-500"
                          required
                        />
                      </div>

                      <div className="p-2 bg-purple-50 border border-purple-200 rounded-xl text-[10px] text-purple-900 font-bold font-mono">
                        Username: ADMIN_PRO | Password: DE_Master#2026!
                      </div>

                      <button
                        type="submit"
                        className="w-full py-3 bg-gradient-to-r from-purple-700 to-indigo-900 hover:from-purple-800 hover:to-indigo-950 text-white font-extrabold rounded-xl shadow-md text-xs border-b-4 border-purple-950 active:translate-y-0.5 active:border-b-2"
                      >
                        Unlock Creator Admin Console
                      </button>
                    </form>
                  </div>
                ) : (
                  <div className="flex-1 overflow-y-auto space-y-5">
                    <div className="flex items-center justify-between bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-emerald-900 font-bold">
                      <span>✓ Creator Authenticated (You have full control of subscriptions & 10% commission payouts)</span>
                      <button onClick={() => setAdminAuthenticated(false)} className="text-xs text-red-600 underline">Lock Console</button>
                    </div>

                    <div className="bg-saffron-50/50 p-4 rounded-xl border border-saffron-200 space-y-3">
                      <h4 className="font-extrabold text-gray-900 text-sm flex items-center justify-between">
                        <span>💳 User Subscription Payments & Access Permits ({subscriptions.length})</span>
                        <span className="text-[11px] text-saffron-700 font-semibold">Approve User Access Here</span>
                      </h4>

                      <div className="space-y-2">
                        {subscriptions.map(sub => (
                          <div key={sub.id} className="p-3 bg-white border rounded-xl flex items-center justify-between gap-3">
                            <div>
                              <strong className="text-gray-900 text-xs block">{sub.userName} (+91 {sub.phone})</strong>
                              <span className="text-[10px] text-gray-500">
                                Plan: <strong className="text-saffron-700">{sub.plan}</strong> (₹{sub.amount}) • Ref: <code className="bg-gray-100 px-1 rounded">{sub.paymentRef}</code>
                              </span>
                            </div>

                            <div className="flex items-center gap-2">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-extrabold ${
                                sub.status === "Approved" ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-800"
                              }`}>
                                {sub.status}
                              </span>

                              {sub.status !== "Approved" ? (
                                <button
                                  onClick={() => handleAdminApproveSubscription(sub.id)}
                                  className="px-3 py-1 bg-indiaGreen-600 hover:bg-indiaGreen-700 text-white font-extrabold rounded-lg text-[10px]"
                                >
                                  ✓ Permit Access
                                </button>
                              ) : (
                                <button
                                  onClick={() => handleAdminRejectSubscription(sub.id)}
                                  className="px-3 py-1 bg-red-100 text-red-700 hover:bg-red-200 font-bold rounded-lg text-[10px]"
                                >
                                  Revoke
                                </button>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="space-y-2">
                      <h4 className="font-bold text-gray-800 text-sm">Add New Service Provider</h4>
                      <form onSubmit={(e) => {
                        e.preventDefault();
                        handleAddProvider({
                          name: e.target.pName.value,
                          category: e.target.pCat.value,
                          price: e.target.pPrice.value,
                          contact: e.target.pPhone.value,
                          idNo: e.target.pIdNo.value,
                          gender: e.target.pGender.value
                        });
                        e.target.reset();
                      }} className="grid grid-cols-2 gap-2 bg-gray-50 p-4 rounded-xl border">
                        <input name="pName" placeholder="Full Name" className="p-2 border rounded-lg" required />
                        <select name="pCat" className="p-2 border rounded-lg">
                          <option value="Electrician">Electrician</option>
                          <option value="Plumber">Plumber</option>
                          <option value="Washing Repair">Washing Repair</option>
                          <option value="Carpenter">Carpenter</option>
                          <option value="Wall Painter">Wall Painter</option>
                          <option value="Water Supplier">Water Supplier</option>
                          <option value="Iron Person">Iron Person</option>
                          <option value="Scavenger / Sanitation">Scavenger / Sanitation</option>
                          <option value="AC Repair">AC Repair</option>
                        </select>
                        <input name="pPrice" placeholder="Price (₹)" type="number" className="p-2 border rounded-lg" required />
                        <input name="pPhone" placeholder="Phone Contact" className="p-2 border rounded-lg" required />
                        <input name="pIdNo" placeholder="Govt ID No (DE-IND-xxxx)" className="p-2 border rounded-lg" required />
                        <select name="pGender" className="p-2 border rounded-lg">
                          <option value="Male">Male</option>
                          <option value="Female">Female</option>
                        </select>
                        <button type="submit" className="col-span-2 py-2.5 bg-indiaGreen-600 hover:bg-indiaGreen-700 text-white font-extrabold rounded-lg shadow-xs">
                          Save New Expert Member
                        </button>
                      </form>
                    </div>

                  </div>
                )}

              </div>
            </div>
          )}

          {/* FOOTER WITH CREATOR INTIMATION */}
          <footer className="bg-gray-900 text-gray-400 py-6 px-4 text-center text-xs mt-auto">
            <p className="font-extrabold text-white">Doorstep Experts Official Play Store App • Created & Managed by You 🇮🇳</p>
            <p className="text-[11px] mt-1 text-gray-500">Google Play ID: com.doorstepexperts.app • 10% Creator Commission Auto-Routed.</p>
          </footer>

          {/* OTHER EXISTING MODALS REMAIN UNCHANGED */}
          {/* LOGIN MODAL */}
          {loginOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
              <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 space-y-4 text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm text-gray-900">OTP Account Login</h3>
                  <button onClick={() => setLoginOpen(false)} className="text-gray-400">✕</button>
                </div>
                <div className="p-2.5 bg-emerald-50 text-emerald-900 rounded-xl font-bold">
                  📱 SMS OTP Login: <u className="font-mono text-sm">123456</u>
                </div>
                <div>
                  <label className="font-bold text-gray-700 block mb-1">Mobile Number</label>
                  <input type="text" defaultValue="9876543210" id="lPhone" className="w-full p-2 border rounded-lg font-mono font-bold" />
                </div>
                <div>
                  <label className="font-bold text-gray-700 block mb-1">OTP Code</label>
                  <input type="text" defaultValue="123456" id="lOtp" className="w-full p-2 border rounded-lg font-mono font-bold text-center text-sm" />
                </div>
                <button
                  onClick={() => {
                    setCurrentUser({ name: "Verified Customer", phone: document.getElementById('lPhone').value, role: 'user' });
                    setLoginOpen(false);
                  }}
                  className="w-full py-2.5 bg-saffron-500 text-white font-extrabold rounded-xl shadow-md"
                >
                  Verify OTP & Login
                </button>
              </div>
            </div>
          )}

          {/* PLAY STORE MODAL */}
          {playStoreModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xs">
              <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden p-6 space-y-4 text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">📲</span>
                    <div>
                      <h3 className="font-extrabold text-sm text-gray-900">Doorstep Experts Play Store App</h3>
                      <span className="text-[10px] font-mono text-gray-500">Package: com.doorstepexperts.app</span>
                    </div>
                  </div>
                  <button onClick={() => setPlayStoreModalOpen(false)} className="text-gray-400 font-bold text-lg">✕</button>
                </div>
                <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl space-y-1 text-[11px] text-emerald-900">
                  <strong className="block font-bold text-xs">✓ Android Studio & Play Store Bundle Ready</strong>
                  <p>Your app source code contains complete Android native package files (<code className="font-mono bg-white px-1 rounded">AndroidManifest.xml</code>, <code className="font-mono bg-white px-1 rounded">MainActivity.java</code>, and <code className="font-mono bg-white px-1 rounded">twa-manifest.json</code>).</p>
                </div>
                <button
                  onClick={() => setPlayStoreModalOpen(false)}
                  className="w-full py-2 bg-gray-100 text-gray-700 font-bold rounded-xl"
                >
                  Close
                </button>
              </div>
            </div>
          )}

          {/* INSTRUCTIONS MODAL */}
          {instructionsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
              <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl p-6 space-y-4 text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm text-gray-900">📖 Doorstep Experts Safety Instructions</h3>
                  <button onClick={() => setInstructionsOpen(false)} className="text-gray-400">✕</button>
                </div>
                <div className="space-y-2 text-gray-700">
                  <p>1. <strong>Verification:</strong> Compare provider badge number before opening the door.</p>
                  <p>2. <strong>Transparent Rates:</strong> Upfront fixed rates without hidden charges.</p>
                  <p>3. <strong>Admin Security:</strong> Admin Console requires username <code>ADMIN_PRO</code> and password <code>DE_Master#2026!</code>.</p>
                </div>
              </div>
            </div>
          )}

          {/* ORDERS MODAL */}
          {ordersOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
              <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl p-6 space-y-4 text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm text-gray-900">My Service Orders ({orders.length})</h3>
                  <button onClick={() => setOrdersOpen(false)} className="text-gray-400">✕</button>
                </div>
                <div className="space-y-3 max-h-80 overflow-y-auto">
                  {orders.map(o => (
                    <div key={o.id} className="p-3 border rounded-xl bg-gray-50 flex justify-between items-center">
                      <div>
                        <strong className="block text-gray-900 font-mono">#{o.id} - {o.providerName}</strong>
                        <span className="text-[10px] text-saffron-700 font-bold">{o.providerCategory} • ₹{o.amount}</span>
                      </div>
                      <button 
                        onClick={() => { setActiveOrder(o); setGpsOpen(true); setOrdersOpen(false); }} 
                        className="px-3 py-1.5 bg-saffron-500 text-white font-extrabold rounded-lg"
                      >
                        Track GPS
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

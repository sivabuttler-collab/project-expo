                    </div>
                    <span className="px-2 py-1 bg-emerald-700 text-white font-bold text-xs rounded-lg">
                      {p.rating} ★
                    </span>
                  </div>

                  <div className="p-4 space-y-2 flex-1 text-xs">
                    <div className="flex justify-between text-gray-600">
                      <span>Govt ID Badge:</span>
                      <strong className="font-mono text-gray-900">{p.idNo}</strong>
                    </div>
                    <div className="flex justify-between text-gray-600">
                      <span>Experience:</span>
                      <strong className="text-gray-800">{p.experience} • {p.completedJobs}+ Jobs</strong>
                    </div>
                    <div className="flex justify-between text-gray-600">
                      <span>Distance:</span>
                      <strong className="text-gray-900">{p.distanceKm} km away</strong>
                    </div>
                    <p className="text-[11px] text-gray-500 italic bg-gray-50 p-2 rounded-lg mt-2">
                      "{p.bio}"
                    </p>
                  </div>

                  <div className="p-4 border-t border-gray-100 flex items-center justify-between">
                    <div>
                      <span className="text-[10px] text-gray-400 font-bold uppercase block">Rate Charge</span>
                      <span className="text-lg font-black text-gray-900">₹{p.price} <span className="text-xs text-gray-500 font-normal">/{p.priceUnit}</span></span>
                    </div>

                    <div className="flex items-center gap-2">
                      <a href={`tel:${p.contact}`} className="p-2 border rounded-xl hover:bg-gray-100 text-gray-700">
                        📞
                      </a>
                      <button 
                        onClick={() => { setSelectedProvider(p); setBookingOpen(true); }}
                        className="px-4 py-2 bg-saffron-500 hover:bg-saffron-600 text-white font-extrabold rounded-xl shadow-md text-xs"
                      >
                        Book Now
                      </button>
                    </div>
                  </div>

                </div>
              ))}
            </div>
          </main>

          {/* FOOTER */}
          <footer className="bg-gray-900 text-gray-400 py-6 px-4 text-center text-xs mt-auto">
            <p className="font-extrabold text-white">Doorstep Experts • Created with Pride in India 🇮🇳</p>
            <p className="text-[11px] mt-1 text-gray-500">All services verified for household safety & transparent pricing.</p>
          </footer>

          {/* BOOKING MODAL */}
          {bookingOpen && selectedProvider && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
              <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden p-6 space-y-4 text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm text-gray-900">Confirm Booking: {selectedProvider.name}</h3>
                  <button onClick={() => setBookingOpen(false)} className="text-gray-400 hover:text-gray-600 font-bold">✕</button>
                </div>
                
                <div className="p-3 bg-saffron-50 rounded-xl flex items-center justify-between">
                  <div>
                    <span className="font-bold text-gray-900">{selectedProvider.category}</span>
                    <p className="text-[10px] text-gray-500">ID: {selectedProvider.idNo}</p>
                  </div>
                  <span className="font-black text-saffron-700 text-base">₹{selectedProvider.price}</span>
                </div>

                <div>
                  <label className="font-bold text-gray-700 block mb-1">Your Name</label>
                  <input type="text" defaultValue="Demo Customer" id="bkName" className="w-full p-2 border rounded-lg" />
                </div>
                <div>
                  <label className="font-bold text-gray-700 block mb-1">Phone Number</label>
                  <input type="text" defaultValue="9876543210" id="bkPhone" className="w-full p-2 border rounded-lg" />
                </div>
                <div>
                  <label className="font-bold text-gray-700 block mb-1">Doorstep Address</label>
                  <textarea defaultValue="Flat 402, Green Valley Apartments, Connaught Place, New Delhi" id="bkAddress" rows={2} className="w-full p-2 border rounded-lg resize-none" />
                </div>

                <button
                  onClick={() => handleConfirmBooking({
                    userName: document.getElementById('bkName').value,
                    userPhone: document.getElementById('bkPhone').value,
                    userAddress: document.getElementById('bkAddress').value,
                    providerName: selectedProvider.name,
                    providerCategory: selectedProvider.category,
                    providerContact: selectedProvider.contact,
                    providerIdNo: selectedProvider.idNo,
                    amount: selectedProvider.price,
                    timeSlot: "Immediately (Within 30 mins)",
                    paymentMethod: "Cash / UPI"
                  })}
                  className="w-full py-3 bg-saffron-500 text-white font-extrabold text-xs rounded-xl shadow-md"
                >
                  Confirm Booking (₹{selectedProvider.price}) & Track GPS
                </button>
              </div>
            </div>
          )}

          {/* LIVE GPS MODAL */}
          {gpsOpen && activeOrder && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-xs">
              <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col">
                <div className="p-4 bg-gray-900 text-white flex justify-between items-center">
                  <div>
                    <h3 className="font-extrabold text-sm flex items-center gap-2">
                      <span>Live GPS Provider Tracking</span>
                      <span className="px-2 py-0.5 bg-emerald-500 text-[9px] rounded-full">LIVE DEMO</span>
                    </h3>
                    <p className="text-[10px] text-gray-400">Order #{activeOrder.id} • {activeOrder.providerName}</p>
                  </div>
                  <button onClick={() => setGpsOpen(false)} className="text-gray-400 hover:text-white">✕</button>
                </div>

                <div className="h-56 bg-slate-900 relative flex items-center justify-center overflow-hidden">
                  <div className="text-center text-white space-y-2">
                    <div className="text-4xl animate-bounce">🛵</div>
                    <span className="text-xs font-bold text-saffron-400 block">{activeOrder.providerName} is en route!</span>
                    <span className="text-[10px] text-emerald-400 bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
                      ETA: ~12 Mins • 1.2 km away
                    </span>
                  </div>
                </div>

                <div className="p-4 space-y-3 bg-gray-50 text-xs">
                  <div className="flex justify-between items-center bg-white p-3 rounded-xl border">
                    <div>
                      <strong className="block text-gray-900">{activeOrder.providerName} ({activeOrder.providerCategory})</strong>
                      <span className="text-[10px] text-gray-500 font-mono">ID: {activeOrder.providerIdNo}</span>
                    </div>
                    <a href={`tel:${activeOrder.providerContact}`} className="px-3 py-1.5 bg-indiaGreen-600 text-white font-extrabold rounded-lg">
                      📞 Call Expert
                    </a>
                  </div>
                  <p className="text-[10px] text-amber-800 bg-amber-50 p-2.5 rounded-lg border border-amber-200">
                    💡 Verify provider badge number ({activeOrder.providerIdNo}) upon doorstep arrival.
                  </p>
                </div>
              </div>
            </div>
          )}

          {/* AI TROUBLESHOOTER MODAL */}
          {aiOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
              <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden p-6 space-y-4 text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm text-indigo-900">🤖 Doorstep AI Home Troubleshooter</h3>
                  <button onClick={() => setAiOpen(false)} className="text-gray-400">✕</button>
                </div>

                <div className="p-3 bg-indigo-50 text-indigo-900 rounded-xl space-y-1">
                  <strong>Describe your issue:</strong>
                  <p className="text-[11px] text-indigo-700">e.g. "Fan burning smell", "Bathroom leak", "Washing machine noise", "Damp wall paint".</p>
                </div>

                <div className="space-y-2">
                  <button 
                    onClick={() => { setSelectedCategory('Electrician'); setAiOpen(false); }} 
                    className="w-full text-left p-2.5 bg-gray-50 hover:bg-saffron-50 rounded-xl border border-gray-200 font-semibold"
                  >
                    ⚡ Fan buzzing or MCB tripping -&gt; Recommend Electrician
                  </button>
                  <button 
                    onClick={() => { setSelectedCategory('Plumber'); setAiOpen(false); }} 
                    className="w-full text-left p-2.5 bg-gray-50 hover:bg-saffron-50 rounded-xl border border-gray-200 font-semibold"
                  >
                    🚰 Water leaking from sink pipe -&gt; Recommend Plumber
                  </button>
                  <button 
                    onClick={() => { setSelectedCategory('Washing Repair'); setAiOpen(false); }} 
                    className="w-full text-left p-2.5 bg-gray-50 hover:bg-saffron-50 rounded-xl border border-gray-200 font-semibold"
                  >
                    🧺 Machine drum vibration / noise -&gt; Recommend Washing Repair
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ADMIN CONSOLE MODAL */}
          {adminOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-xs">
              <div className="bg-white w-full max-w-3xl rounded-2xl shadow-2xl overflow-hidden p-6 space-y-4 text-xs h-[85vh] flex flex-col">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm text-gray-900">🔒 Admin Management Console</h3>
                  <button onClick={() => setAdminOpen(false)} className="text-gray-400">✕</button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-3">
                  <h4 className="font-bold text-gray-800">Add New Service Provider</h4>
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    handleAddProvider({
                      name: e.target.pName.value,
                      category: e.target.pCat.value,
                      price: e.target.pPrice.value,
                      contact: e.target.pPhone.value,
                      idNo: e.target.pIdNo.value,
                      gender: e.target.pGender.value
                    });
                    e.target.reset();
                  }} className="grid grid-cols-2 gap-2 bg-gray-50 p-3 rounded-xl border">
                    <input name="pName" placeholder="Full Name" className="p-2 border rounded-lg" required />
                    <select name="pCat" className="p-2 border rounded-lg">
                      <option value="Electrician">Electrician</option>
                      <option value="Plumber">Plumber</option>
                      <option value="Washing Repair">Washing Repair</option>
                      <option value="Carpenter">Carpenter</option>
                      <option value="Wall Painter">Wall Painter</option>
                      <option value="Water Supplier">Water Supplier</option>
                      <option value="Iron Person">Iron Person</option>
                      <option value="Scavenger / Sanitation">Scavenger / Sanitation</option>
                    </select>
                    <input name="pPrice" placeholder="Price (₹)" type="number" className="p-2 border rounded-lg" required />
                    <input name="pPhone" placeholder="Phone Contact" className="p-2 border rounded-lg" required />
                    <input name="pIdNo" placeholder="Govt ID No (DE-IND-xxxx)" className="p-2 border rounded-lg" required />
                    <select name="pGender" className="p-2 border rounded-lg">
                      <option value="Male">Male</option>
                      <option value="Female">Female</option>
                    </select>
                    <button type="submit" className="col-span-2 py-2 bg-indiaGreen-600 text-white font-extrabold rounded-lg">
                      Save New Expert Member
                    </button>
                  </form>

                  <h4 className="font-bold text-gray-800 pt-2">Current Service Members ({providers.length})</h4>
                  <div className="space-y-1">
                    {providers.map(p => (
                      <div key={p.id} className="flex justify-between items-center p-2 bg-gray-50 border rounded-lg">
                        <span><strong>{p.name}</strong> ({p.category}) - ₹{p.price} | ID: {p.idNo}</span>
                        <button onClick={() => handleDeleteProvider(p.id)} className="text-red-600 font-bold">Remove</button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* INSTRUCTIONS MODAL */}
          {instructionsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
              <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl p-6 space-y-4 text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm text-gray-900">📖 Doorstep Experts Safety Instructions</h3>
                  <button onClick={() => setInstructionsOpen(false)} className="text-gray-400">✕</button>
                </div>
                <div className="space-y-2 text-gray-700">
                  <p>1. <strong>Verification:</strong> Compare the provider's badge number on the app before opening the door.</p>
                  <p>2. <strong>Transparent Rates:</strong> Upfront fixed rates without hidden charges.</p>
                  <p>3. <strong>OTP Sign In:</strong> Enter 10-digit mobile number and test code <code>123456</code>.</p>
                  <p>4. <strong>Live GPS:</strong> Track the assigned expert's arrival on the map.</p>
                </div>
              </div>
            </div>
          )}

          {/* LOGIN MODAL */}
          {loginOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
              <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 space-y-4 text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm text-gray-900">OTP Account Login</h3>
                  <button onClick={() => setLoginOpen(false)} className="text-gray-400">✕</button>
                </div>

                <div className="p-2.5 bg-emerald-50 text-emerald-900 rounded-xl font-bold">
                  📱 Demo OTP Code: <u className="font-mono text-sm">123456</u>
                </div>

                <div>
                  <label className="font-bold text-gray-700 block mb-1">Mobile Number</label>
                  <input type="text" defaultValue="9876543210" id="lPhone" className="w-full p-2 border rounded-lg font-mono font-bold" />
                </div>
                <div>
                  <label className="font-bold text-gray-700 block mb-1">OTP Code</label>
                  <input type="text" defaultValue="123456" id="lOtp" className="w-full p-2 border rounded-lg font-mono font-bold text-center text-sm" />
                </div>

                <button
                  onClick={() => {
                    setCurrentUser({ name: "Demo User", phone: document.getElementById('lPhone').value, role: 'user' });
                    setLoginOpen(false);
                  }}
                  className="w-full py-2.5 bg-saffron-500 text-white font-extrabold rounded-xl shadow-md"
                >
                  Verify OTP & Login
                </button>
              </div>
            </div>
          )}

          {/* ORDERS MODAL */}
          {ordersOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
              <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl p-6 space-y-4 text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm text-gray-900">My Service Orders ({orders.length})</h3>
                  <button onClick={() => setOrdersOpen(false)} className="text-gray-400">✕</button>
                </div>
                <div className="space-y-3 max-h-80 overflow-y-auto">
                  {orders.map(o => (
                    <div key={o.id} className="p-3 border rounded-xl bg-gray-50 flex justify-between items-center">
                      <div>
                        <strong className="block text-gray-900 font-mono">#{o.id} - {o.providerName}</strong>
                        <span className="text-[10px] text-saffron-700 font-bold">{o.providerCategory} • ₹{o.amount}</span>
                      </div>
                      <button 
                        onClick={() => { setActiveOrder(o); setGpsOpen(true); setOrdersOpen(false); }} 
                        className="px-3 py-1.5 bg-saffron-500 text-white font-extrabold rounded-lg"
                      >
                        Track GPS
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* LOCATION MODAL */}
          {locationOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
              <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 space-y-3 text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm text-gray-900">Select City / Locality</h3>
                  <button onClick={() => setLocationOpen(false)} className="text-gray-400">✕</button>
                </div>
                {[
                  { city: "New Delhi", area: "Connaught Place, Central Delhi" },
                  { city: "Mumbai", area: "Bandra West, Marine Drive" },
                  { city: "Bengaluru", area: "Indiranagar, Koramangala" },
                  { city: "Hyderabad", area: "Jubilee Hills, HITECH City" },
                  { city: "Chennai", area: "T. Nagar, Anna Nagar" }
                ].map((item, idx) => (
                  <div 
                    key={idx} 
                    onClick={() => { setSelectedLocation(item); setLocationOpen(false); }}
                    className="p-2.5 bg-gray-50 hover:bg-saffron-50 rounded-xl cursor-pointer border"
                  >
                    <strong className="block text-gray-900">{item.city}</strong>
                    <span className="text-[10px] text-gray-500">{item.area}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

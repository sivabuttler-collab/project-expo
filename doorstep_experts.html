          {instructionsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
              <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl p-6 space-y-4 text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm text-gray-900">📖 Doorstep Experts Safety Instructions</h3>
                  <button onClick={() => setInstructionsOpen(false)} className="text-gray-400">✕</button>
                </div>
                <div className="space-y-2 text-gray-700">
                  <p>1. <strong>Verification:</strong> Compare the provider's badge number on the app before opening the door.</p>
                  <p>2. <strong>Transparent Rates:</strong> Upfront fixed rates without hidden charges.</p>
                  <p>3. <strong>Home Store & Tip:</strong> Tap '🛍️ Store & Live Workers' on the left to buy spare parts or check worker status.</p>
                  <p>4. <strong>10% Creator Commission:</strong> 10% of every completed job payment is automatically routed to the Creator Admin Bank Account.</p>
                  <p>5. <strong>Admin Security:</strong> Admin Console requires creator password <code>admin123</code>.</p>
                </div>
              </div>
            </div>
          )}

          {/* LOGIN MODAL */}
          {loginOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
              <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 space-y-4 text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm text-gray-900">OTP Account Login</h3>
                  <button onClick={() => setLoginOpen(false)} className="text-gray-400">✕</button>
                </div>

                <div className="p-2.5 bg-emerald-50 text-emerald-900 rounded-xl font-bold">
                  📱 Demo OTP Code: <u className="font-mono text-sm">123456</u>
                </div>

                <div>
                  <label className="font-bold text-gray-700 block mb-1">Mobile Number</label>
                  <input type="text" defaultValue="9876543210" id="lPhone" className="w-full p-2 border rounded-lg font-mono font-bold" />
                </div>
                <div>
                  <label className="font-bold text-gray-700 block mb-1">OTP Code</label>
                  <input type="text" defaultValue="123456" id="lOtp" className="w-full p-2 border rounded-lg font-mono font-bold text-center text-sm" />
                </div>

                <button
                  onClick={() => {
                    setCurrentUser({ name: "Demo User", phone: document.getElementById('lPhone').value, role: 'user' });
                    setLoginOpen(false);
                  }}
                  className="w-full py-2.5 bg-saffron-500 text-white font-extrabold rounded-xl shadow-md"
                >
                  Verify OTP & Login
                </button>
              </div>
            </div>
          )}

          {/* ORDERS MODAL */}
          {ordersOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
              <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl p-6 space-y-4 text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm text-gray-900">My Service Orders ({orders.length})</h3>
                  <button onClick={() => setOrdersOpen(false)} className="text-gray-400">✕</button>
                </div>
                <div className="space-y-3 max-h-80 overflow-y-auto">
                  {orders.map(o => (
                    <div key={o.id} className="p-3 border rounded-xl bg-gray-50 flex justify-between items-center">
                      <div>
                        <strong className="block text-gray-900 font-mono">#{o.id} - {o.providerName}</strong>
                        <span className="text-[10px] text-saffron-700 font-bold">{o.providerCategory} • ₹{o.amount}</span>
                      </div>
                      <button 
                        onClick={() => { setActiveOrder(o); setGpsOpen(true); setOrdersOpen(false); }} 
                        className="px-3 py-1.5 bg-saffron-500 text-white font-extrabold rounded-lg"
                      >
                        Track GPS
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* LOCATION MODAL */}
          {locationOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
              <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 space-y-3 text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm text-gray-900">Select City / Locality</h3>
                  <button onClick={() => setLocationOpen(false)} className="text-gray-400">✕</button>
                </div>
                {[
                  { city: "New Delhi", area: "Connaught Place, Central Delhi" },
                  { city: "Mumbai", area: "Bandra West, Marine Drive" },
                  { city: "Bengaluru", area: "Indiranagar, Koramangala" },
                  { city: "Hyderabad", area: "Jubilee Hills, HITECH City" },
                  { city: "Chennai", area: "T. Nagar, Anna Nagar" }
                ].map((item, idx) => (
                  <div 
                    key={idx} 
                    onClick={() => { setSelectedLocation(item); setLocationOpen(false); }}
                    className="p-2.5 bg-gray-50 hover:bg-saffron-50 rounded-xl cursor-pointer border"
                  >
                    <strong className="block text-gray-900">{item.city}</strong>
                    <span className="text-[10px] text-gray-500">{item.area}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
